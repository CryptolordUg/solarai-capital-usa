<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SolarAI Capital - Delaware, USA</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui;background:#f6f7fb;color:#111827}
header{padding:16px 20px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#7c3aed;font-size:20px}
.btn{padding:10px 18px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-p{background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #e5e7eb;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="logo">⚡ SolarAI Capital - Delaware, USA</div><div><button class="btn" onclick="show('login')">Login</button> <button class="btn btn-p" onclick="show('register')">Start Investing</button></div></header>

<div id="home" class="card"><h1>Solar Infrastructure Investing<br><span style="color:#7c3aed">8% - 15% APY</span></h1><p>Delaware Registered • SEC Compliant • USDT (TRC20) • Firebase LIVE</p><br><button class="btn btn-p" onclick="show('register')">Invest Now - Starter $100</button></div>

<div id="register" class="card hidden" style="max-width:460px;margin:40px auto"><h2>Create Account - LIVE</h2><p style="color:green;font-size:12px">🔒 Firebase Connected</p><input id="rName" placeholder="Full Name"><input id="rEmail" type="email" placeholder="Email"><input id="rPass" type="password" placeholder="Password min 6"><button class="btn btn-p" style="width:100%;margin-top:12px" onclick="doRegister()">Create Account</button><p id="rMsg" style="color:red;font-size:12px;margin-top:8px"></p><p style="margin-top:10px"><a href="#" onclick="show('login')">Login instead</a></p></div>

<div id="login" class="card hidden" style="max-width:460px;margin:40px auto"><h2>Login - LIVE</h2><input id="lEmail" type="email" placeholder="Email"><input id="lPass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%;margin-top:12px" onclick="doLogin()">Login</button><p id="lMsg" style="color:red;font-size:12px;margin-top:8px"></p></div>

<div id="dashboard" class="card hidden"><h2>Welcome <span id="uName"></span></h2><p>Email: <span id="uEmail"></span> | Balance: <b id="uBal">$0</b></p><button class="btn" onclick="doLogout()">Logout</button></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCQPwUopPvRH_8QprQcdWd1LyXgnzBb1Ko",
  authDomain: "solarai-capital.firebaseapp.com",
  projectId: "solarai-capital",
  storageBucket: "solarai-capital.firebasestorage.app",
  messagingSenderId: "722787765054",
  appId: "1:722787765054:web:68ff8eac7bd505c077fa6f"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
function show(id){['home','register','login','dashboard'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function doRegister(){
 const name=document.getElementById('rName').value.trim(); const email=document.getElementById('rEmail').value.trim(); const pass=document.getElementById('rPass').value.trim();
 if(!name||!email||!pass){document.getElementById('rMsg').innerText='Fill all fields';return;}
 document.getElementById('rMsg').innerText='Creating...';
 auth.createUserWithEmailAndPassword(email,pass).then(c=>db.collection('users').doc(email).set({email:email,name:name,fullName:name,balance:0,profit:0,status:'active',plan:'Starter',createdAt:firebase.firestore.FieldValue.serverTimestamp()})).then(()=>{document.getElementById('rMsg').style.color='green';document.getElementById('rMsg').innerText='Created! Go to login.';setTimeout(()=>show('login'),1200);}).catch(e=>{document.getElementById('rMsg').innerText=e.message;});
}
function doLogin(){
 const email=document.getElementById('lEmail').value.trim(); const pass=document.getElementById('lPass').value.trim();
 document.getElementById('lMsg').innerText='Logging...';
 auth.signInWithEmailAndPassword(email,pass).then(c=>db.collection('users').doc(email).get()).then(d=>{let data=d.data()||{name:email,email:email,balance:0};document.getElementById('uName').innerText=data.name||email;document.getElementById('uEmail').innerText=data.email;document.getElementById('uBal').innerText='$'+(data.balance||0);show('dashboard');}).catch(e=>{document.getElementById('lMsg').innerText=e.message;});
}
function doLogout(){auth.signOut();show('home');}
</script>
</body>
</html>
