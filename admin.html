<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin PRO - LIVE</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui;background:#f6f7fb;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:18px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.btn{padding:8px 12px;border-radius:8px;border:none;font-weight:700;cursor:pointer}.btn-p{background:#7c3aed;color:#fff}</style>
</head><body>
<div class="card"><h2>SolarAI Admin PRO - LIVE 🔥</h2><p>Treasury: TATeM34UJsHhnADWrjemiYXdrHiyuPrFra | Gas: OK 15,240 Energy | Binance: 24ms</p><p>Admin: <span id="aEmail"></span> <button onclick="firebase.auth().signOut()">Logout</button></p></div>
<div class="card"><h3>Deposits / Withdrawals - LIVE (Approve Here)</h3><div id="depList">Loading deposits...</div></div>
<div class="card"><h3>Investors 360° - REAL DATA FROM FIRESTORE</h3><div id="userList">Loading users...</div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyCQPwUopPvRH_8QprQcdWd1LyXgnz8b1Ko", authDomain: "solarai-capital.firebaseapp.com", projectId: "solarai-capital", storageBucket: "solarai-capital.firebasestorage.app", messagingSenderId: "722787765054", appId: "1:722787765054:web:68ff8eac7bd505c077fa6f", measurementId: "G-BB7294S77J" };
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
auth.onAuthStateChanged(u=>{if(!u){window.location.href='/'; return;} if(u.email!=="cryptome2030@gmail.com"){alert("Access Denied - Rubon Wealth Admin Only - Founder Seal: Rubon Love"); window.location.href='/'; return;} document.getElementById('email').innerText=u.email; loadUsers(); loadDeposits();});
function loadUsers(){ db.collection('users').onSnapshot(s=>{let h='<table><tr><th>Email</th><th>Name</th><th>Balance</th><th>Profit</th><th>Status</th><th>Action</th></tr>'; s.forEach(d=>{let x=d.data(); h+=`<tr><td>${x.email}</td><td>${x.name}</td><td>$${x.balance||0}</td><td>$${x.profit||0}</td><td>${x.status}</td><td><button onclick="addBal('${x.email}')">Add Balance</button> <button onclick="addProfit('${x.email}')">Add Profit</button></td></tr>`;}); h+='</table>'; document.getElementById('userList').innerHTML=h;});}
function loadDeposits(){ db.collection('deposits').orderBy('createdAt','desc').onSnapshot(s=>{let h='<table><tr><th>User</th><th>Amount</th><th>Plan</th><th>Status</th><th>Date</th><th>Approve</th></tr>'; if(s.empty) h+='<tr><td colspan=6>No transactions yet - waiting for first deposit</td></tr>'; s.forEach(d=>{let x=d.data(); h+=`<tr><td>${x.email}</td><td>$${x.amount}</td><td>$${x.plan}</td><td>${x.status}</td><td>${x.createdAt?.toDate().toLocaleString()||''}</td><td>${x.status=='pending'?`<button class="btn btn-p" onclick="approve('${d.id}','${x.email}',${x.amount},${x.plan})">Approve & Add Balance</button>`:'Approved'}</td></tr>`;}); h+='</table>'; document.getElementById('depList').innerHTML=h;});}
function approve(id,email,amount,plan){ if(!confirm(`Approve $${amount} for ${email}? This will add to balance.`)) return; db.collection('deposits').doc(id).update({status:'approved'}).then(()=>db.collection('users').doc(email).update({balance:firebase.firestore.FieldValue.increment(amount),plan:plan==100?'Starter':plan==500?'Growth':plan==1000?'Pro':'Enterprise'})).then(()=>alert('✅ Approved! Balance added to '+email)); }
function addBal(email){let a=parseFloat(prompt('Amount to add to balance:')); if(!a) return; db.collection('users').doc(email).update({balance:firebase.firestore.FieldValue.increment(a)}).then(()=>alert('Balance Added'));}
function addProfit(email){let a=parseFloat(prompt('Daily profit to add:')); if(!a) return; db.collection('users').doc(email).update({profit:firebase.firestore.FieldValue.increment(a),balance:firebase.firestore.FieldValue.increment(a)}).then(()=>alert('Profit Added - User sees growth!'));}
</script></body></html>
