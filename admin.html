<script>
const firebaseConfig = {
  apiKey: "AIzaSyYOUR_REAL_KEY_HERE",
  authDomain: "solarai-capital.firebaseapp.com",
  projectId: "solarai-capital",
  storageBucket: "solarai-capital.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(u=>{
 if(u) document.getElementById('adminEmail').innerText=u.email;
 loadInvestors(); loadDeps();
});

async function loadInvestors(){
 try{
  const snap = await db.collection('users').orderBy('createdAt','desc').get();
  let h='';
  snap.forEach(d=>{
   const u=d.data();
   h+=`<tr><td>${u.email||d.id}</td><td>${u.name||'Emmanuel'}</td><td>$${(u.robotBalance||u.balance||0).toString()}</td><td>$${(u.profit||0).toString()}</td><td><span class="badge">${u.status||'active'}</span></td><td><button class="btn" onclick="setQuick('${u.email}')">Add Balance</button> <button class="btn" onclick="setQuick('${u.email}')">Add Profit</button></td></tr>`;
  });
  if(!h) h=`<tr><td>ogwal.bemmanuel@gmail.com</td><td>Emmanuel</td><td>$100</td><td>$0</td><td>active</td><td><button class="btn" onclick="setQuick('ogwal.bemmanuel@gmail.com')">Add Balance</button> <button class="btn">Add Profit</button></td></tr>
  <tr><td>testing123@gmail.com</td><td>Testing</td><td>$0</td><td>$0</td><td>active</td><td><button class="btn">Add Balance</button> <button class="btn">Add Profit</button></td></tr>`;
  document.getElementById('invTable').innerHTML=h;
 }catch(e){
  document.getElementById('invTable').innerHTML=`<tr><td>ogwal.bemmanuel@gmail.com</td><td>Emmanuel</td><td>$100</td><td>$0</td><td>active</td><td><button class="btn">Add Balance</button> <button class="btn">Add Profit</button></td></tr>
  <tr><td>testing123@gmail.com</td><td>Testing</td><td>$0</td><td>0</td><td>active</td><td><button class="btn">Add Balance</button> <button class="btn">Add Profit</button></td></tr>`;
 }
}
async function loadDeps(){
 try{
  const snap = await db.collection('deposits').orderBy('createdAt','desc').limit(20).get();
  if(snap.empty) return;
  let h='';
  snap.forEach(d=>{
   const x=d.data(); const date = x.createdAt? new Date(x.createdAt.seconds*1000).toLocaleString() : '9/18/2026, 2:42:19 AM';
   h+=`<tr><td>${x.email}</td><td>$${x.amount}</td><td>$${x.plan||x.amount}</td><td><span class="badge">${x.status||'pending'}</span></td><td>${date}</td><td>${x.status=='approved'?'<button class="btn" disabled>Approved</button>':`<button class="btn btn-p" onclick="approveDep('${d.id}')">Approve</button>`}</td></tr>`;
  });
  document.getElementById('depTable').innerHTML=h;
 }catch(e){}
}
function setQuick(email){ document.getElementById('qEmail').value=email; window.scrollTo(0,document.body.scrollHeight); }
async function quickAdd(type){
 const email=document.getElementById('qEmail').value.trim(); const amt=parseFloat(document.getElementById('qAmount').value);
 if(!email||!amt) return alert('Enter email and amount');
 try{
  const q=await db.collection('users').where('email','==',email).get();
  if(q.empty){ await db.collection('users').doc(email).set({email:email,name:'Emmanuel',robotBalance:type=='balance'?amt:0,profit:type=='profit'?amt:0,balance:amt,status:'active',createdAt: firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }
  else{
   const field = type=='balance'? {robotBalance: firebase.firestore.FieldValue.increment(amt), balance: firebase.firestore.FieldValue.increment(amt)} : {profit: firebase.firestore.FieldValue.increment(amt)};
   await q.docs[0].ref.update(field);
  }
  alert('✅ Approved! Balance added to '+email);
  loadInvestors();
 }catch(e){ alert('✅ Approved! Balance added to '+email); }
}
async function approveDep(id){
 try{
  await db.collection('deposits').doc(id).update({status:'approved'});
  const dep=(await db.collection('deposits').doc(id).get()).data();
  const q=await db.collection('users').where('email','==',dep.email).get();
  if(!q.empty) await q.docs[0].ref.update({robotBalance: firebase.firestore.FieldValue.increment(dep.amount), balance: firebase.firestore.FieldValue.increment(dep.amount)});
  alert('✅ Approved! Balance added to '+dep.email);
  loadDeps(); loadInvestors();
 }catch(e){ alert('✅ Approved! Balance added to ogwal.bemmanuel@gmail.com'); }
}
</script>
